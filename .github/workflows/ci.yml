name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Lint
        run: uv run --with ruff ruff check coordinator worker dashboard protocol

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env for build-time variable substitution
        run: cp .env.example .env
      - name: Build images
        run: docker compose build
