services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  coordinator:
    build:
      context: .
      dockerfile: coordinator/Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENROLLMENT_SECRET: ${ENROLLMENT_SECRET}
      CREDENTIAL_PEPPER: ${CREDENTIAL_PEPPER}
      # Operator credential (Step 2.2.1) — a different value from
      # ENROLLMENT_SECRET, and never given to the worker service below.
      ADMIN_SECRET: ${ADMIN_SECRET}
      # Defaults match the coordinator's own (see app/config.py); exposed
      # here so a Phase 2.3 scale run can register a large fleet without
      # tripping the per-client registration limit, and can shorten the
      # assignment safety-net poll. Neither is changed for normal dev.
      REGISTER_RATE_LIMIT_PER_MINUTE: ${REGISTER_RATE_LIMIT_PER_MINUTE:-5}
      ASSIGNMENT_POLL_INTERVAL_SECONDS: ${ASSIGNMENT_POLL_INTERVAL_SECONDS:-30}
      # Phase 2.5 result retention. Defaults match app/config.py (7 days,
      # hourly sweep); exposed here so the sweep can be demonstrated in a
      # local session without waiting a week for the first pass.
      RESULT_RETENTION_DAYS: ${RESULT_RETENTION_DAYS:-7}
      RESULT_RETENTION_SWEEP_INTERVAL_SECONDS: ${RESULT_RETENTION_SWEEP_INTERVAL_SECONDS:-3600}
      TASK_RESULT_MAX_BYTES: ${TASK_RESULT_MAX_BYTES:-131072}
    ports:
      - "${COORDINATOR_PORT}:8443"
    volumes:
      - ./certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL}
      COORDINATOR_URL: https://coordinator:8443
      ENROLLMENT_SECRET: ${ENROLLMENT_SECRET}
      # The dashboard is an operator tool, so it gets the operator
      # credential (Step 2.2.1). The worker service below does not.
      ADMIN_SECRET: ${ADMIN_SECRET}
    ports:
      - "${DASHBOARD_PORT}:8444"
    volumes:
      - ./certs:/certs:ro
    depends_on:
      coordinator:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      WORKER_LOOP_INTERVAL_SECONDS: 5
      COORDINATOR_URL: https://coordinator:8443
      ENROLLMENT_SECRET: ${ENROLLMENT_SECRET}
      # Phase 2.3 capabilities, declared in `hello`. Overridable so a scale
      # run can set the credit count, and so a worker can be started
      # deliberately ineligible for a type to demonstrate that such a task
      # stays queued rather than being dropped.
      WORKER_MAX_CONCURRENT: ${WORKER_MAX_CONCURRENT:-4}
      WORKER_SUPPORTED_TASK_TYPES: ${WORKER_SUPPORTED_TASK_TYPES:-count_to_n,hash_rounds,sleep,opaque_payload}
      # Phase 2.4 progress cadence (recommendation, not measured). Lowered
      # from the 10s default for local dev only, so a short demo task
      # actually reports progress before it finishes.
      WORKER_PROGRESS_INTERVAL_SECONDS: ${WORKER_PROGRESS_INTERVAL_SECONDS:-5}
    volumes:
      - ./certs:/certs:ro
      - worker-identity-data:/var/lib/worker-identity
    depends_on:
      coordinator:
        condition: service_healthy

volumes:
  postgres-data:
  worker-identity-data:
