# Pin the lint ruleset explicitly so CI is reproducible across ruff
# releases. These four groups are ruff's classic default select; the CI
# lint job used an unpinned ruff and a newer release began firing opt-in
# rules (S/SIM/RUF) the project never adopted. Making the selection
# explicit fixes the drift without churning curated code (see the
# intentional `# noqa: BLE001` in worker/worker.py).
[lint]
select = ["E4", "E7", "E9", "F"]
