# Default values. Per-environment overrides in values-staging.yaml /
# values-production.yaml. Secret VALUES are never here (CLAUDE.md §12) —
# only the names of pre-created Secrets (see infra/helm/bootstrap-secrets.ps1).

# Optional pull secrets for the container registry. Empty by default: the
# ghcr.io packages are expected to be PUBLIC (no auth needed to pull). If a
# package is made private, add a sealed dockerconfigjson Secret name here,
# e.g. [{ name: ghcr-pull }].
imagePullSecrets: []

coordinator:
  image:
    # ghcr.io (Decision #45). Tag with the commit SHA, never :latest
    # (Step 1.5.3 exit criterion). Overridden per-deploy in values-staging.
    repository: ghcr.io/muhammadhassanminhas/data-cleaning-distributed-system-coordinator
    tag: latest
    pullPolicy: IfNotPresent   # SHA tags are immutable; no need to re-pull
  # replica count is owned by the HPA below (hpa.minReplicas), not a
  # Deployment replicas field — see templates/coordinator.yaml.
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    # CPU limit kept at 300m so a maxSurge=1 rollout (a transient 3rd
    # coordinator pod) stays within the namespace limits.cpu=2 quota
    # (1.5.1): 3 pods*300m + dashboard/pg/redis 900m = 1800m <= 2000m.
    limits: { cpu: 300m, memory: 256Mi }
  hpa:
    minReplicas: 1
    maxReplicas: 2   # single B2s_v2 node + namespace quota (Decision #57)
    targetCPUUtilizationPercentage: 70
  pdb:
    minAvailable: 1

dashboard:
  image:
    repository: ghcr.io/muhammadhassanminhas/data-cleaning-distributed-system-dashboard
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

postgres:
  image: postgres:16-alpine
  storage: 1Gi
  # storageClassName left unset → AKS default StorageClass (managed-csi).
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

redis:
  image: redis:7-alpine
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

config:
  logLevel: INFO
  postgresUser: coordinator
  postgresDb: coordinator

# Public ingress (Step 1.5.5). Disabled by default; staging turns it on.
# host MUST be set to the Terraform `ingress_fqdn` output
# (<label>.<region>.cloudapp.azure.com) for the env that enables it.
ingress:
  enabled: false
  host: ""                              # = terraform output ingress_fqdn
  tlsSecret: platform-tls               # cert-manager writes the LE cert here
  clusterIssuerName: letsencrypt-prod
  createClusterIssuer: false            # exactly one env creates the cluster-scoped issuer
  letsencryptEmail: ""                  # required when createClusterIssuer=true
  basicAuthSecret: dashboard-basic-auth # pre-created htpasswd Secret (bootstrap)
  limitRps: 5                           # edge rate limit on coordinator paths

# Observability (Step 1.5.6). When true, the chart emits a ServiceMonitor
# (coordinator /metrics scrape) and a PrometheusRule (alerts). Both need the
# Prometheus Operator CRDs installed cluster-wide by Terraform
# (observability.tf). Disabled by default; staging turns it on.
observability:
  enabled: false

# Names of Secrets created out-of-band (bootstrap script for now,
# sealed-secrets in CI/CD Step 1.5.3/1.5.4). The chart references, never
# defines, them.
secretNames:
  app: app-secrets          # ENROLLMENT_SECRET, CREDENTIAL_PEPPER — worker-facing
  admin: admin-secret       # ADMIN_SECRET — operator only, never given to a worker (Step 2.2.1)
  postgres: postgres-secret # POSTGRES_PASSWORD
  tls: tls-certs            # coordinator.crt/key, dashboard.crt/key, dev-ca.crt
