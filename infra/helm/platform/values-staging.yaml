# Staging overrides (Decision #40 — staging namespace) on AKS (Decision #57).
# coordinator replicas: 2 (D-D) so pod-delete-reschedule, rolling upgrade,
# and the PodDisruptionBudget are actually demonstrable. HONEST CEILING
# (CLAUDE.md §10): both replicas land on the single node — this proves the
# reschedule/rolling-upgrade MECHANICS, not true multi-node HA. Real HA
# needs >1 node = more student credit; deferred.
coordinator:
  # image.tag MUST be set to the pushed commit SHA at deploy time, e.g.
  #   helm upgrade ... --set coordinator.image.tag=$(git rev-parse --short HEAD)
  hpa:
    # Step 1.5.7 (horizontal-scaling proof): floor raised 2->3 so three
    # replicas serve one fleet simultaneously (exit criterion 1); ceiling
    # 2->5 gives the autoscaler real headroom to add pods under load and
    # remove them after (exit criterion 4). Fits the raised namespace quota
    # (limits.cpu=3, Terraform var namespace_quota) and the 2-node pool.
    minReplicas: 3
    maxReplicas: 5
config:
  logLevel: DEBUG

# Observability ON for staging (Step 1.5.6) — this is the env the stack is
# demoed against. Emits the coordinator ServiceMonitor + alert rules.
observability:
  enabled: true

# Public ingress ON for staging (Step 1.5.5). host = Terraform's
# `ingress_fqdn` output; set letsencryptEmail before the first deploy.
ingress:
  enabled: true
  host: dcds-staging.centralindia.cloudapp.azure.com
  createClusterIssuer: true
  letsencryptEmail: muhammadhassan1762005@gmail.com
