{{- if .Values.observability.enabled }}
# Step 1.5.6 metric-based alerts. These fire from Prometheus and route to
# the Discord/Slack webhook wired in Alertmanager (observability.tf).
#
# Every alert carries `team: dcds` so Alertmanager routes ONLY our alerts to
# the chat receiver — the generic kube-prometheus built-in alerts stay muted
# instead of spamming the channel (observability.tf route + Step 1.5.6 #7).
#
# NOT declared here (added in Grafana at demo time, both log-derived):
#   - auth-failure spike: a LogQL count over the `*_rejected` events the
#     coordinator already logs (§11), via the Loki datasource.
# Everything below is metric-derived and declarable, so it lives in Git.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: coordinator-alerts
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: coordinator.rules
      rules:
        # up{} comes from the ServiceMonitor scrape target being reachable.
        # `absent(...)` is essential: when every replica is gone the series
        # disappears entirely, so `max(up)==0` alone never fires (an empty
        # vector is not 0). absent() covers exactly the "all replicas down or
        # unreachable" case the summary names (Step 1.5.6 C3).
        - alert: CoordinatorDown
          expr: (absent(up{service="coordinator"}) == 1) or (max(up{service="coordinator"}) == 0)
          for: 1m
          labels: { severity: critical, team: dcds }
          annotations:
            summary: "Coordinator is not scrapeable (all replicas down or unreachable)."
        # These two deliberately do NOT get the `absent()` guard that
        # CoordinatorDown has, and that is a correction to an earlier note
        # which called the missing guard a gap "worth hardening in M3".
        # It is not a gap. `_refresh_fleet_gauges` sets
        # `coordinator_dependency_up` on *every* scrape — 1 on success, 0
        # in its own except block — so the series is absent only when the
        # coordinator is not being scraped at all, which is precisely the
        # condition CoordinatorDown already alerts on.
        #
        # Adding `absent()` here would therefore fire "cannot reach
        # Postgres" whenever the coordinator pods are gone, even with a
        # perfectly healthy database: a false positive, duplicated across
        # three alerts for one event. Detection is not lost without it —
        # a full coordinator outage still pages, just as CoordinatorDown.
        # What these two mean, exactly: *the coordinator is up and reports
        # it cannot reach the dependency.*
        - alert: DatabaseDown
          expr: max(coordinator_dependency_up{dependency="database"}) == 0
          for: 2m
          labels: { severity: critical, team: dcds }
          annotations:
            summary: "Coordinator is up but cannot reach Postgres."
        - alert: RedisDown
          expr: max(coordinator_dependency_up{dependency="redis"}) == 0
          for: 2m
          labels: { severity: critical, team: dcds }
          annotations:
            summary: "Coordinator is up but cannot reach Redis."
        # Fleet drop: connected workers fell sharply vs 10 min ago. Threshold
        # is a RECOMMENDATION, not measured — tune once real fleet size is known.
        - alert: WorkerFleetDrop
          expr: max(coordinator_workers_connected) < 0.5 * max(coordinator_workers_connected offset 10m)
          for: 5m
          labels: { severity: warning, team: dcds }
          annotations:
            summary: "Connected worker count dropped by more than half in 10 minutes."
        # ---- Phase 3.1 lease engine ----
        #
        # **The one that matters most is the backlog, not the rate.** A
        # reclaimer that has died emits no reclaim events at all, which in
        # any counter looks exactly like a healthy system with nothing to
        # reclaim. `coordinator_leases_overdue` is recomputed from Postgres
        # on every scrape by every replica, so a backlog that climbs and
        # never drains is visible even when the loop that should be
        # draining it is gone. `max` because the series is identical across
        # replicas (see `metrics._refresh_fleet_gauges`).
        #
        # 5 minutes, not 1: the reclaim interval is 5s and the batch is
        # 100, so a genuine burst — a whole node's worth of workers dying
        # at once — legitimately shows a backlog for a few passes while it
        # drains. Alerting on the drain would page for recovery working.
        - alert: LeaseReclaimBacklog
          expr: max(coordinator_leases_overdue) > 0
          for: 5m
          labels: { severity: critical, team: dcds }
          annotations:
            summary: "Task leases have been expired without being reclaimed for 5 minutes — the reclaimer may have stopped."
        # Sustained expiry: tasks are being taken back from workers at a
        # rate that means something is wrong with the fleet rather than
        # with one machine. Threshold is a RECOMMENDATION, not measured —
        # it is well above the zero a healthy fleet produces and well below
        # the pipeline's measured ~110-124 tasks/s (#141). `sum` not `max`:
        # this is a per-instance counter (see `app/metrics.py`).
        - alert: TaskLeaseExpirySustained
          expr: sum(rate(coordinator_leases_expired_total[5m])) > 1
          for: 10m
          labels: { severity: warning, team: dcds }
          annotations:
            summary: "Task leases are expiring at over 1/s for 10 minutes — workers are losing work faster than they finish it."
        # ---- Phase 3.2 retry engine ----
        #
        # **Exhaustion is the one worth waking up for.** A reassignment is
        # the recovery system doing its job and a fleet under rolling
        # restarts produces a trickle of them; a task reaching terminal
        # FAILED is the system giving up on work forever, and by design
        # nothing retries it again (gate §3.0.4 item 2). Any sustained rate
        # of that is a real loss of work, not a transient.
        #
        # Threshold and window are RECOMMENDATIONS, not measured. `sum` not
        # `max`: both are per-instance counters.
        - alert: TaskAttemptsExhausted
          expr: sum(rate(coordinator_tasks_exhausted_total[10m])) > 0
          for: 10m
          labels: { severity: critical, team: dcds }
          annotations:
            summary: "Tasks are exhausting their attempts and landing in terminal FAILED — work is being given up on."
        # Sustained reassignment: distinct from the expiry alert above,
        # which counts leases; this counts the tasks that actually went back
        # to the queue for another try. A high rate here with a *low*
        # exhaustion rate means retries are succeeding, which is recovery
        # working under a fleet problem worth looking at rather than an
        # emergency.
        - alert: TaskReassignmentSustained
          expr: sum(rate(coordinator_tasks_reassigned_total[5m])) > 1
          for: 10m
          labels: { severity: warning, team: dcds }
          annotations:
            summary: "Tasks are being reassigned at over 1/s for 10 minutes — the fleet is losing work faster than one bad machine explains."
        # Phase 3.4. Sustained fencing, which the design gate asked for by
        # name (§3.0.9). This is the only alert in this file that fires on
        # **work being thrown away rather than retried**: every fenced
        # submission is a task that was genuinely executed and whose result
        # was refused, so the CPU that produced it is spent for nothing.
        #
        # Any sustained rate is worth a look, hence a threshold of zero over
        # a long window rather than a rate. `by (reason)` is kept rather than
        # summed away because the two reasons have different fixes — a
        # `stale_attempt` storm says the lease TTL is short for the work
        # being run, a `task_reassigned` storm says workers are dropping off
        # — and grouping by it puts the reason on the firing alert's own
        # labels, where Alertmanager renders it without this template needing
        # to escape a `$labels` reference through Helm.
        #
        # Threshold and window are RECOMMENDATIONS, not measured. `sum` not
        # `max`: this is a per-instance counter.
        - alert: ResultsFencedSustained
          expr: sum by (reason) (rate(coordinator_results_fenced_total[10m])) > 0
          for: 15m
          labels: { severity: warning, team: dcds }
          annotations:
            summary: "Results are being fenced continuously for 15 minutes — completed work is being discarded, not retried. See the alert's `reason` label."
        # A queue that is entirely retry backlog. Not a failure on its own —
        # every one of these tasks is waiting out a backoff that will end —
        # but a queue whose depth is all backed-off retries for half an hour
        # is a fleet that cannot execute what it is being given, and the
        # depth graph alone cannot show it.
        - alert: TasksStuckAwaitingRetry
          expr: max(coordinator_tasks_awaiting_retry) > 0 and max(coordinator_tasks_awaiting_retry) >= max(coordinator_tasks_queued)
          for: 30m
          labels: { severity: warning, team: dcds }
          annotations:
            summary: "Every queued task has been waiting on a retry backoff for 30 minutes — nothing is executing successfully."
        # cert-manager exports this; alerts before Let's Encrypt renewal.
        - alert: CertificateNearExpiry
          expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < 7 * 24 * 3600
          for: 1h
          labels: { severity: warning, team: dcds }
          annotations:
            summary: "A managed TLS certificate expires in under 7 days."
{{- end }}
