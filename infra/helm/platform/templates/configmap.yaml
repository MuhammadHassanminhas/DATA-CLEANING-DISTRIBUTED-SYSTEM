# Non-secret env shared by coordinator + dashboard. Hosts/ports are
# in-cluster service DNS names. RUN_MIGRATIONS_ON_STARTUP=false because
# migrations run once in the coordinator initContainer (Decision #55,
# config.py:41), not in every replica's boot.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: {{ .Values.config.postgresUser | quote }}
  POSTGRES_DB: {{ .Values.config.postgresDb | quote }}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  # Pinned, not defaulted in code: kubelet injects a service-link variable
  # `<SERVICE>_PORT=tcp://<ip>:<port>` into every pod for every Service in
  # the namespace, and there is a Service named `coordinator`. Step 3.5's
  # entrypoint (`python -m app.serve`) is the first thing to read
  # COORDINATOR_PORT, so without this the coordinator parses
  # "tcp://10.0.x.x:8443" as an int and crashloops — in Kubernetes only.
  # POSTGRES_PORT and REDIS_PORT above are pinned for the same reason.
  COORDINATOR_HOST: "0.0.0.0"
  COORDINATOR_PORT: "8443"
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  COORDINATOR_URL: https://coordinator:8443
  RUN_MIGRATIONS_ON_STARTUP: "false"
