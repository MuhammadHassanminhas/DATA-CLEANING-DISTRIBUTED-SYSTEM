# Coordinator: Deployment + Service + HPA + PodDisruptionBudget.
# Migrations run in an initContainer BEFORE the app container starts
# (Decision #55) — the app image's own startup migration is disabled via
# RUN_MIGRATIONS_ON_STARTUP=false in app-config. Rolling update is
# surge-one / zero-unavailable so an upgrade never drops the fleet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
spec:
  # No replicas field: the HorizontalPodAutoscaler below owns replica count.
  # Setting it here fights kube-controller-manager's scale subresource
  # (server-side-apply conflict) and lets the HPA floor override intent.
  # The replica count is governed by hpa.minReplicas (see values-*.yaml).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Replace-in-place (surge 0, unavailable 1), NOT surge-then-drain.
      # The namespace limits.cpu=2 quota (1.5.1) can't fit a transient 3rd
      # coordinator pod on top of two existing ones, so a maxSurge=1 rollout
      # deadlocks. With 2 replicas + maxUnavailable=1, one replica keeps
      # serving throughout (PDB minAvailable=1) — the fleet is never dropped.
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels: { app: coordinator }
  template:
    metadata:
      labels: { app: coordinator }
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432 -U \"$POSTGRES_USER\"; do echo waiting-for-postgres; sleep 2; done"]
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: {{ .Values.secretNames.postgres }} }
          # Required: the namespace ResourceQuota (Step 1.5.1) tracks
          # requests/limits for every container, initContainers included.
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
        # ponytail: alembic upgrade, one-shot before serve. With maxSurge=1
        # + minReplicas>=1 only one pod ever migrates pending revisions at a
        # time; a cold multi-replica start would race — add a DB advisory
        # lock if that path ever becomes real.
        - name: migrate
          image: "{{ .Values.coordinator.image.repository }}:{{ .Values.coordinator.image.tag }}"
          imagePullPolicy: {{ .Values.coordinator.image.pullPolicy }}
          workingDir: /app/coordinator
          # PYTHONPATH so alembic's env.py can `import app.config` — the
          # alembic CLI entrypoint lives in /usr/local/bin, so cwd isn't
          # on sys.path the way it is under uvicorn.
          command: ["sh", "-c", "PYTHONPATH=/app/coordinator alembic upgrade head"]
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: {{ .Values.secretNames.app }} }
            - secretRef: { name: {{ .Values.secretNames.postgres }} }
          resources: {{ toYaml .Values.coordinator.resources | nindent 12 }}
      containers:
        - name: coordinator
          image: "{{ .Values.coordinator.image.repository }}:{{ .Values.coordinator.image.tag }}"
          imagePullPolicy: {{ .Values.coordinator.image.pullPolicy }}
          ports:
            - containerPort: 8443
          env:
            # Deployed image SHA, surfaced at /health for CD's version
            # assertion (Step 1.5.4, exit criterion 4). image.tag is the
            # commit SHA set by CD at deploy time (--set coordinator.image.tag).
            - name: GIT_SHA
              value: "{{ .Values.coordinator.image.tag }}"
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: {{ .Values.secretNames.app }} }
            - secretRef: { name: {{ .Values.secretNames.postgres }} }
          volumeMounts:
            - name: tls
              mountPath: /certs
              readOnly: true
          livenessProbe:
            httpGet: { path: /health, port: 8443, scheme: HTTPS }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: 8443, scheme: HTTPS }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: {{ toYaml .Values.coordinator.resources | nindent 12 }}
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.secretNames.tls }}
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator
spec:
  selector: { app: coordinator }
  ports:
    - port: 8443
      targetPort: 8443
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: coordinator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: coordinator
  minReplicas: {{ .Values.coordinator.hpa.minReplicas }}
  maxReplicas: {{ .Values.coordinator.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.coordinator.hpa.targetCPUUtilizationPercentage }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: coordinator
spec:
  minAvailable: {{ .Values.coordinator.pdb.minAvailable }}
  selector:
    matchLabels: { app: coordinator }
