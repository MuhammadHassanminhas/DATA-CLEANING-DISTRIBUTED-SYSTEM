{{- if .Values.ingress.createClusterIssuer }}
# Let's Encrypt production issuer, HTTP-01 solved through ingress-nginx.
# Cluster-scoped, so exactly ONE environment creates it (staging:
# createClusterIssuer=true; production: false). cert-manager's CRDs are
# installed by Terraform (helm_release.cert_manager) before this chart is
# deployed, so this applies cleanly.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.ingress.clusterIssuerName }}
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ required "ingress.letsencryptEmail is required when createClusterIssuer=true" .Values.ingress.letsencryptEmail | quote }}
    privateKeySecretRef:
      name: {{ .Values.ingress.clusterIssuerName }}-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
{{- end }}
