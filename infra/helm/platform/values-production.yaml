# Production overrides (Decision #40 — production namespace) on AKS.
# Same single-node cluster today; production HA remains bounded by node
# count (see values-staging honest-ceiling note).
coordinator:
  hpa:
    minReplicas: 2
    maxReplicas: 2
config:
  logLevel: INFO

# Public ingress OFF for production (Step 1.5.5 honest ceiling): a second
# public env needs a second static IP + FQDN and more node headroom than
# the single B2s_v2 has. The templates are ready — flip enabled=true, set a
# distinct host (a second Terraform IP), and keep createClusterIssuer=false
# (staging already owns the cluster-scoped issuer) when that runway exists.
ingress:
  enabled: false
