# Demo-only: a worker running as an in-cluster pod so it appears live on the
# dashboard without native-Windows (fcntl) or Docker-host TLS-SAN issues. It
# reaches the coordinator by its in-cluster service name (cert SAN covers
# `coordinator`) and uses the secrets already in the namespace. Real external
# workers on other networks are Step 1.5.8 (after public ingress, 1.5.5).
# Delete when done:  kubectl -n staging delete -f demo-worker.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-worker
  namespace: staging
  labels: { app: demo-worker }
spec:
  replicas: 1
  selector: { matchLabels: { app: demo-worker } }
  template:
    metadata: { labels: { app: demo-worker } }
    spec:
      containers:
        - name: worker
          image: ghcr.io/muhammadhassanminhas/data-cleaning-distributed-system-worker:0df7e2063141dba549b901cefc1b7a6349bd6ef3
          env:
            - name: COORDINATOR_URL
              value: https://coordinator:8443
            - name: WORKER_CA_FILE
              value: /certs/dev-ca.crt
            - name: WORKER_AGENT_VERSION
              value: demo-worker-1
            - name: ENROLLMENT_SECRET
              valueFrom: { secretKeyRef: { name: app-secrets, key: ENROLLMENT_SECRET } }
          volumeMounts:
            - { name: tls, mountPath: /certs, readOnly: true }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
      volumes:
        - name: tls
          secret: { secretName: tls-certs }
